<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta IQ - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom primary color theme */
        :root {
            --primary-color: #4f46e5; /* Indigo 600 */
        }
        .text-primary { color: var(--primary-color); }
        .bg-primary { background-color: var(--primary-color); }
        .hover\:bg-primary-dark:hover { background-color: #4338ca; } /* Indigo 700 */
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-white shadow-md w-full fixed top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">

            <div class="flex items-center space-x-3">
                <div class="text-2xl font-bold text-primary">
                    <a href="index.html">Insta IQ</a>
                </div>
            </div>

            <nav class="space-x-4">
                <img 
                    src="LOGO INSTA IQ.png" 
                    alt="Insta IQ Secondary Logo" 
                    class="h-12 w-auto" 
                > 
            </nav>
        </div>
    </header>

    <div class="flex flex-col items-center pt-[80px] pb-10">
        <div class="w-full max-w-md">

            <div class="text-center mb-8">
                <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
                    Create Your Account
                </h2>
                <p class="mt-2 text-sm text-gray-600">
                    Or
                    <a href="login.html" class="font-medium text-primary hover:text-indigo-500">
                        sign in to an existing account
                    </a>
                </p>
            </div>

            <div class="bg-white py-8 px-4 shadow-xl rounded-lg sm:px-10">
                <form class="space-y-6" id="signupForm">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                        <div class="mt-1">
                            <input id="name" name="name" type="text" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" autocomplete="new-password" required class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                        </div>
                    </div>

                    <div id="messageArea" class="text-sm font-medium"></div>

                    <div>
                        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-150">
                            Create Account
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
</body>
</html>
