<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Insta IQ - Interview Practice</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="styles.css" />
        <style>
            :root {
                --primary-color: #4f46e5; /* Indigo 600 */
            }
            .text-primary {
                color: var(--primary-color);
            }
            .bg-primary {
                background-color: var(--primary-color);
            }
            .hover\:bg-primary-dark:hover {
                background-color: #4338ca;
            } /* Indigo 700 */
        </style>
    </head>
    <body class="bg-gray-50 min-h-screen">
        <header class="bg-white shadow-md w-full fixed top-0 z-50">
            <div
                class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center"
            >
                <div class="flex items-center space-x-3">
                    <div class="text-2xl font-bold text-primary">
                        <a href="index.html">Insta IQ</a>
                    </div>
                </div>

                <nav class="space-x-4">
                    <img
                        src="LOGO INSTA IQ.png"
                        alt="Insta IQ Secondary Logo"
                        class="h-12 w-auto"
                    />
                </nav>
            </div>
        </header>
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 pt-[120px]">
            <div class="flex justify-between items-center mb-10">
                <h1 class="text-3xl font-bold text-gray-800">
                    Welcome back,
                    <span id="userNameDisplay" class="text-primary">User!</span>
                </h1>
                <a
                    href="#"
                    class="flex items-center text-gray-600 hover:text-primary transition duration-150"
                >
                    <span class="text-xl mr-2">👤</span>
                    <span class="font-medium">Profile</span>
                </a>
            </div>

            <h2 class="text-2xl font-semibold text-gray-700 mb-6">
                Choose Interview Type
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <a href="#" class="interview-card" data-type="HR">
                    <div
                        class="bg-white p-8 rounded-xl shadow-lg hover:shadow-2xl transition duration-300 transform hover:scale-[1.02]"
                    >
                        <div class="text-5xl mb-4 text-primary">🤝</div>
                        <h3 class="text-xl font-bold text-gray-900">
                            HR Interview
                        </h3>
                        <p class="mt-2 text-gray-500">
                            Behavioral & soft skills questions.
                        </p>
                    </div>
                </a>

                <a href="#" class="interview-card" data-type="Technical">
                    <div
                        class="bg-white p-8 rounded-xl shadow-lg hover:shadow-2xl transition duration-300 transform hover:scale-[1.02]"
                    >
                        <div class="text-5xl mb-4 text-primary">💻</div>
                        <h3 class="text-xl font-bold text-gray-900">
                            Technical Interview
                        </h3>
                        <p class="mt-2 text-gray-500">
                            Domain expertise and problem-solving.
                        </p>
                    </div>
                </a>

                <a href="#" class="interview-card" data-type="Personal">
                    <div
                        class="bg-white p-8 rounded-xl shadow-lg hover:shadow-2xl transition duration-300 transform hover:scale-[1.02]"
                    >
                        <div class="text-5xl mb-4 text-primary">👤</div>
                        <h3 class="text-xl font-bold text-gray-900">
                            Personal Interview
                        </h3>
                        <p class="mt-2 text-gray-500">
                            Background, motivation, and fit questions.
                        </p>
                    </div>
                </a>
            </div>
        </main>

        <script type="module" src="scripts/interview.js"></script>
    </body>
</html>
